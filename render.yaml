# Render Blueprint Deployment Configuration for Paayh / Xea Background Worker
services:
  - type: worker
    name: xea-background-worker
    env: node
    region: oregon
    # Plan: Standard / Pro for production autoscaling support
    plan: standard
    # Baseline production instances (2 instances provide HA redundancy)
    numInstances: 2
    # Dynamic Horizontal Autoscaling:
    # Automatically scales from 1 up to 4 worker instances when active traffic
    # exceeds 20,000 users or CPU/Memory exceeds 70-75% to drain BullMQ queues instantly.
    scaling:
      minInstances: 1
      maxInstances: 4
      targetCPUPercent: 70
      targetMemoryPercent: 75
    buildCommand: npm install
    startCommand: npm run worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_TLS
        value: "true"
      - key: REDIS_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: AUTH0_SECRET
        sync: false
      - key: CLICKHOUSE_HOST
        sync: false
      - key: CLICKHOUSE_USER
        value: "default"
      - key: CLICKHOUSE_PASSWORD
        sync: false
      - key: CLICKHOUSE_DATABASE
        value: "default"
